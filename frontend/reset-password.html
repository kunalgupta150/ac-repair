
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - AC CARE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #06285c;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            color: white;
            background: #1769e0;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resetMessage {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main class="reset-card">
        <h1>AC CARE</h1>
        <h2>Choose a New Password</h2>

        <p>Enter your new password below.</p>

        <form id="resetPasswordForm">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                required
                minlength="8"
                maxlength="128"
                autocomplete="new-password">

            <label for="confirmNewPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmNewPassword"
                required
                minlength="8"
                maxlength="128"
                autocomplete="new-password">

            <button type="submit" id="resetPasswordButton">
                Reset Password
            </button>

            <p id="resetMessage" role="status" aria-live="polite"></p>
        </form>

        <p><a href="login.html">Back to Login</a></p>
    </main>

    <script>
        const resetForm = document.getElementById("resetPasswordForm");
        const resetMessage = document.getElementById("resetMessage");
        const resetButton = document.getElementById("resetPasswordButton");

        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmNewPassword").value;

            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            const role = params.get("role");

            if (newPassword !== confirmPassword) {
                resetMessage.textContent = "Passwords do not match.";
                return;
            }

            if (!token || !["customer", "technician", "admin"].includes(role)) {
                resetMessage.textContent =
                    "This reset link is invalid. Request a new link from the login page.";
                return;
            }

            resetButton.disabled = true;
            resetMessage.textContent = "Updating your password...";

            try {
                const response = await fetch(
                    "http://localhost:5000/api/auth/reset-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            token: token,
                            role: role,
                            newPassword: newPassword
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Password reset failed."
                    );
                }

                resetMessage.textContent =
                    "Password reset successfully. You can now log in.";

                resetForm.reset();

                // Remove the reset token from the address bar.
                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

            } catch (error) {
                console.error("Password reset failed:", error);
                resetMessage.textContent = error.message;
            } finally {
                resetButton.disabled = false;
            }
        });
    </script>
</body>
</html>
